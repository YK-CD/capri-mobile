name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # The ubuntu-latest image already ships the Android SDK, so no extra
      # setup step is needed (android-actions/setup-android fails on the
      # `sdkmanager tools` shim on current images).
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: capri-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
